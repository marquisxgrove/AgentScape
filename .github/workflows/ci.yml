name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch/PR: a newer push cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-gcc }
          - { os: macos-15, name: macos-clang }
          - { os: windows-2022, name: windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a hung test (e.g. an MSVC debug-assert dialog) must not hold a runner for 6 h
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake --preset dev
      - name: Build
        run: cmake --build --preset dev
      - name: Test
        run: ctest --preset dev --timeout 300
      - name: Upload smoke snapshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-snapshots-${{ matrix.name }}
          path: |
            build/dev/smoke/*.png
            build/dev/smoke-costumer/*.png
            build/dev/smoke-codex/*.png
            build/dev/smoke-path/*.png
          if-no-files-found: ignore

  asan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: linux-asan
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev
      - run: cmake --preset asan
      - run: cmake --build --preset asan
      - run: ctest --preset asan --timeout 300

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: web
    steps:
      - uses: actions/checkout@v5
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.8
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
      - run: cmake --preset web
      - run: cmake --build --preset web
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            build/web/agentscape.html
            build/web/agentscape.js
            build/web/agentscape.wasm
            build/web/agentscape.data
          retention-days: 7
