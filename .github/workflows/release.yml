name: Release

# Builds the desktop apps (Windows, macOS, Linux) and the web build, and attaches them to a GitHub Release, when a
# version tag is pushed:   git tag v1.0.0 && git push origin v1.0.0
# The release builds have the Kiroween layer forced on for judging. They are not code-signed (see the README).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux-x64, exe: agentscape }
          - { os: macos-15, name: macos-arm64, exe: agentscape }
          - { os: windows-2022, name: windows-x64, exe: agentscape.exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v5
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev \
            libgl1-mesa-dev libegl1-mesa-dev libdrm-dev libgbm-dev libssl-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # "Sign in with GitHub" appears only when the repository variable AS_GITHUB_CLIENT_ID holds an OAuth App client id
      # (Settings -> Secrets and variables -> Actions -> Variables). It is public by design; the device flow needs no
      # secret. Unset, the build has no GitHub sign-in and no libcurl.
      - name: Configure
        run: cmake --preset release -DAS_BUILD_TESTS=OFF -DAS_KIROWEEN_DEFAULT=on "-DAS_GITHUB_CLIENT_ID=${{ vars.AS_GITHUB_CLIENT_ID }}"
      - name: Build
        run: cmake --build --preset release
      - name: Package
        shell: bash
        run: |
          dir="AgentScape-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "build/release/${{ matrix.exe }}" "$dir/"
          cp -R build/release/assets "$dir/assets"
          cp LICENSE THIRD_PARTY_NOTICES.md "$dir/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi
          ls -la "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: AgentScape-${{ matrix.name }}
          path: |
            AgentScape-${{ matrix.name }}.zip
            AgentScape-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 4.0.8
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
      - run: cmake --preset web -DAS_KIROWEEN_DEFAULT=on
      - run: cmake --build --preset web
      - name: Package
        run: |
          mkdir -p AgentScape-web
          cp build/web/agentscape.html AgentScape-web/index.html
          cp build/web/agentscape.js build/web/agentscape.wasm build/web/agentscape.data AgentScape-web/
          cp LICENSE THIRD_PARTY_NOTICES.md AgentScape-web/
          zip -r AgentScape-web.zip AgentScape-web
      - uses: actions/upload-artifact@v7
        with:
          name: AgentScape-web
          path: AgentScape-web.zip
          if-no-files-found: error

  publish:
    needs: [desktop, web]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
