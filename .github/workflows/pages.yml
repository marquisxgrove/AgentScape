name: Deploy web build

# Publishes the WebAssembly build to GitHub Pages on every push to main (and on demand). The judging build has the
# Kiroween layer forced on, so the spooky town is visible whatever the date.
#
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.8
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - run: echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset web -DAS_KIROWEEN_DEFAULT=on
      - name: Build
        run: cmake --build --preset web
      - name: Assemble the site
        run: |
          mkdir -p site
          cp build/web/agentscape.html site/index.html
          cp build/web/agentscape.js build/web/agentscape.wasm build/web/agentscape.data site/
          touch site/.nojekyll
          ls -la site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
