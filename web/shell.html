<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgentScape</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #ffd84a; font-family: monospace; }
    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas#canvas { width: 100%; height: 100%; image-rendering: pixelated; outline: none; }
    #loading, #error { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; background: #1b1410; }
    #error { display: none; }
    progress { width: 240px; accent-color: #ff9a1f; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas></div>
  <div id="loading"><p>Loading AgentScape…</p><progress id="bar" value="0" max="100"></progress></div>
  <div id="error"><p>Your browser needs WebGL to play AgentScape.</p></div>
  <script>
    (function () {
      var canvas = document.getElementById('canvas');
      var gl = canvas.getContext('webgl2') || canvas.getContext('webgl');
      if (!gl) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
        return;
      }
      var Module = {
        canvas: canvas,
        print: function (t) { console.log(t); },
        printErr: function (t) { console.warn(t); },
        setStatus: function (text) {
          var m = /([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/.exec(text);
          if (m) { document.getElementById('bar').value = 100 * parseInt(m[2]) / parseInt(m[4]); }
          if (!text) { document.getElementById('loading').style.display = 'none'; }
        }
      };
      window.Module = Module;
    })();
  </script>
  {{{ SCRIPT }}}
</body>
</html>
